[package]
name = "osu2bs-app"
version = "0.1.0"
description = "osu2bs — mp3 to Beat Saber maps"
edition = "2021"

[lib]
name = "osu2bs_app"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = "8.6.0"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }

[profile.release]
strip = true
lto = "thin"  # fat LTO costs ~1min+ of link time per platform in CI
opt-level = "s"
